services:
  db:
    image: postgres:17
    container_name: invoice_db_local
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoice_password}
      POSTGRES_DB: ${POSTGRES_DB:-invoice}
    ports:
      - "${PG_PORT:-5440}:5432"
    volumes:
      - invoice_db_local_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: invoice_redis_local
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - invoice_redis_local_data:/data

  proxy:
    image: nginx:1.27-alpine
    container_name: invoice_proxy_local
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-host.docker.internal:8000}
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-host.docker.internal:3000}
    ports:
      - "${PROXY_PORT:-8001}:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    command: >
      sh -c "envsubst '$${BACKEND_UPSTREAM}$${FRONTEND_UPSTREAM}'
      < /etc/nginx/templates/nginx.conf.template
      > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  invoice_db_local_data:
  invoice_redis_local_data: