name: Staging

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]
  push:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILWAY_API: https://backboard.railway.com/graphql/v2
  RAILWAY_PROJECT: 3d1b6173-3b08-4965-a4e4-d2ab61d95b6b
  RAILWAY_ENV: 29f5b19a-8137-48ff-bd76-2595a7a5904c
  RAILWAY_SERVICE: 398877f8-5452-4c4c-833a-cd53aaeb66a7

jobs:
  backend:
    name: ${{ (github.event_name == 'push' && 'Deploy' || 'Preview') }} backend → Railway
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deploy
        if: env.RAILWAY_TOKEN != ''
        run: |
          curl -s -X POST "${{ env.RAILWAY_API }}" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceDeploy(serviceId: \"${{ env.RAILWAY_SERVICE }}\", environmentId: \"${{ env.RAILWAY_ENV }}\", latestCommit: true) }"
            }'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

  comment:
    name: ${{ (github.event_name == 'push' && 'Notify commit' || 'Comment PR') }}
    needs: [backend]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isMerge = '${{ github.event_name }}' === 'push';
            const deployStatus = '${{ needs.backend.result }}';

            if (isMerge) {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `## ✅ Staging actualizado\n\nMerge a \`staging\` completado.\n\n| Servicio | URL |\n|----------|-----|\n| Frontend | stg.fintral.app |\n| Backend  | stg-api.fintral.app |\n\n> Railway desplegó la última versión de \`staging\`.`
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🚀 Preview lista — PR #${{ github.event.number }}\n\n| Servicio | URL | Estado |\n|----------|-----|--------|\n| Frontend | stg.fintral.app (Vercel auto) | ✅ Auto-deployed |\n| Backend  | stg-api.fintral.app (Railway \`staging\`) | ${deployStatus === 'success' ? '✅ Deploy triggered' : '❌ Failed'} |\n\nMergea esta PR a \`staging\` para promover los cambios a estable.`
              });
            }