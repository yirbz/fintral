name: Staging

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]
  push:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILWAY_API: https://backboard.railway.com/graphql/v2
  RAILWAY_PROJECT: 3d1b6173-3b08-4965-a4e4-d2ab61d95b6b
  RAILWAY_ENV: 29f5b19a-8137-48ff-bd76-2595a7a5904c
  RAILWAY_SERVICE: 398877f8-5452-4c4c-833a-cd53aaeb66a7

jobs:
  frontend:
    name: ${{ (github.event_name == 'push' && 'Deploy' || 'Preview') }} frontend → Vercel
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dopplerhq/secrets-fetch-action@v1.3.1
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_STG }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Project Info
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npx vercel pull --yes --environment=production
          else
            npx vercel pull --yes --environment=preview
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_EFfddjRHIl9rcFwJJP105uZ8
          VERCEL_PROJECT_ID: prj_YxDVjxE1yDXMh7O3LKCEoDAxghEf

      - name: Build
        run: npx vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_EFfddjRHIl9rcFwJJP105uZ8
          VERCEL_PROJECT_ID: prj_YxDVjxE1yDXMh7O3LKCEoDAxghEf
          NEXT_PUBLIC_ENVIRONMENT: STAGING
          NEXT_PUBLIC_APP_URL: ${{ steps.doppler.outputs.NEXT_PUBLIC_APP_URL }}
          BACKEND_URL: ${{ steps.doppler.outputs.BACKEND_URL }}

      - name: Deploy
        id: deploy
        run: |
          flags="--prebuilt"
          if [ "${{ github.event_name }}" = "push" ]; then
            flags="$flags --prod"
          fi
          url=$(npx vercel deploy $flags --stdout)
          echo "url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_EFfddjRHIl9rcFwJJP105uZ8
          VERCEL_PROJECT_ID: prj_YxDVjxE1yDXMh7O3LKCEoDAxghEf

  backend:
    name: ${{ (github.event_name == 'push' && 'Deploy' || 'Preview') }} backend → Railway
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deploy
        if: env.RAILWAY_TOKEN != ''
        run: |
          curl -s -X POST "${{ env.RAILWAY_API }}" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceDeployV2(serviceId: \"${{ env.RAILWAY_SERVICE }}\", environmentId: \"${{ env.RAILWAY_ENV }}\") }"
            }'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

  comment:
    name: ${{ (github.event_name == 'push' && 'Notify' || 'Comment PR') }}
    needs: [frontend]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isMerge = '${{ github.event_name }}' === 'push';
            const frontendUrl = '${{ needs.frontend.outputs.url }}';

            if (isMerge) {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `## ✅ Staging Deployed (stable)\n\nMerged to \`staging\`.\n\n| Service | URL |\n|---------|-----|\n| Frontend | ${frontendUrl ? `[Preview](${frontendUrl})` : 'stg.fintral.app'} |\n| Backend | [stg-api.fintral.app](https://stg-api.fintral.app) |\n\n> DNS records for \`stg.fintral.app\` and \`stg-api.fintral.app\` point to this stable version.`
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🚀 Staging Preview Ready\n\n| Service | URL |\n|---------|-----|\n| Frontend | ${frontendUrl || '[Preview](https://stg.fintral.app)'} |\n| Backend | [stg-api.fintral.app](https://stg-api.fintral.app) |\n\n> ⏳ **Preview** — merge this PR to \`staging\` for the stable release. CI checks ran on this branch (lint, typecheck, tests).`
              });
            }