services:
  db:
    image: postgres:17
    container_name: invoice_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoice_password}
      POSTGRES_DB: ${POSTGRES_DB:-invoice}
    ports:
      - "5440:5432"
    volumes:
      - invoice_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: invoice_redis
    ports:
      - "6381:6379"
    volumes:
      - invoice_redis_data:/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice_app
    env_file:
      - .env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-invoice}:${POSTGRES_PASSWORD:-invoice_password}@db:5432/${POSTGRES_DB:-invoice}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/static:/app/static
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoice_frontend
    environment:
      - BACKEND_URL=http://app:8000
      - HOSTNAME=0.0.0.0
    depends_on:
      - app
    expose:
      - "3000"

  proxy:
    image: nginx:1.27-alpine
    container_name: invoice_proxy
    depends_on:
      - app
      - frontend
    ports:
      - "${PROXY_PORT:-8001}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  invoice_db_data:
  invoice_redis_data:
