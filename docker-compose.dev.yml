# Development environment
# Requires: Doppler CLI + `supabase start` running in background
# Usage: doppler run -- docker compose -f docker-compose.dev.yml up -d
#
# Supabase local containers (managed by CLI):
#   - Postgres :54322
#   - GoTrue   :54321
#   - Storage  :54321 (via Kong)
# These are reached via host.docker.internal from app containers.

services:
  redis:
    image: redis:7
    container_name: fintral-redis-dev
    ports:
      - "${LOCAL_REDIS_PORT:-${REDIS_PORT:-6381}}:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - fintral-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fintral-backend-dev
    env_file: []
    environment:
      # ── Infra (topology loaded from local .env) ──
      - ENVIRONMENT=${LOCAL_ENVIRONMENT:-${ENVIRONMENT:-DEVELOPMENT}}
      - BACKEND_PORT=8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER:-http://127.0.0.1:54321/auth/v1}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-invoices}
      - DATABASE_URL=${LOCAL_DATABASE_URL:-${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5440/invoices}}
      - REDIS_URL=${LOCAL_REDIS_URL:-${REDIS_URL}}
      # ── Secrets (inherited from Doppler via shell — no default) ──
      - APP_JWT_SECRET_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - AI_PIPELINE_KEY
      - AI_PIPELINE_MODEL
      - AI_PIPELINE_FALLBACK_MODEL
      - AI_SIDECAR_KEY
      - AI_SIDECAR_MODEL
      - AI_SIDECAR_FALLBACK_MODEL
      - RESEND_API_KEY
      - EMAIL_FROM
      - PUBLIC_APP_URL
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - ADMIN_FULL_NAME
      - QUICKBOOKS_CLIENT_ID
      - QUICKBOOKS_CLIENT_SECRET
      - QUICKBOOKS_REDIRECT_URI
      - XERO_CLIENT_ID
      - XERO_CLIENT_SECRET
      - XERO_REDIRECT_URI
      - ALANUBE_API_URL
      - ALANUBE_JWT
      # ── Telegram bot (admin notifications) ──
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      # ── Paddle Billing ──
      - PADDLE_API_KEY
      - PADDLE_WEBHOOK_SECRET
      - PADDLE_ENVIRONMENT
      - PADDLE_CLIENT_TOKEN
      - PADDLE_PRODUCT_INICIAL
      - PADDLE_PRICE_INICIAL_MONTHLY
      - PADDLE_PRODUCT_PROFESIONAL
      - PADDLE_PRICE_PROFESIONAL_MONTHLY
      - PADDLE_PRODUCT_DESPACHO
      - PADDLE_PRICE_DESPACHO_MONTHLY
      # ── Lago Billing Engine ──
      - LAGO_API_URL=${LOCAL_LAGO_API_URL:-http://lago-api:3000}
      - LAGO_API_KEY=${LAGO_API_KEY:-fintral-lago-key-dev}
      - LAGO_WEBHOOK_SECRET=${LAGO_WEBHOOK_SECRET:-fintral-lago-webhook-secret-dev}
      # ── MIO Payment Gateway ──
      - MIO_CLIENT_ID
      - MIO_CLIENT_SECRET
      - MIO_ENVIRONMENT=${MIO_ENVIRONMENT:-staging}
      - MIO_API_BASE_URL=${MIO_API_BASE_URL:-https://api-mpos-mio.stg.geopagos.io}
      - MIO_AUTH_URL=${MIO_AUTH_URL:-https://auth.stg.geopagos.io}
      - MIO_WEBHOOK_URL
      - MIO_SUCCESS_REDIRECT
      - MIO_FAILED_REDIRECT
      # ── Banco Popular Exchange Rate API ──
      - BANCO_POPULAR_API_URL
      - BANCO_POPULAR_API_KEY
      - BANCO_POPULAR_SECRET_KEY
      - BANCO_POPULAR_FALLBACK_RATE
      # ── Bank Transfer Details ──
      - BANK_NAME
      - BANK_ACCOUNT_HOLDER
      - BANK_ACCOUNT_NUMBER
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__/
      - uploads_data:/app/uploads
      - static_data:/app/static
    ports:
      - "${LOCAL_BACKEND_PORT:-${BACKEND_PORT:-8000}}:${LOCAL_BACKEND_PORT:-${BACKEND_PORT:-8000}}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fintral-dev
      - supabase_network_fintral-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fintral-frontend-dev
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_ENVIRONMENT=${LOCAL_ENVIRONMENT:-${ENVIRONMENT:-DEVELOPMENT}}
      - NEXT_PUBLIC_APP_URL=${LOCAL_NEXT_PUBLIC_APP_URL:-${NEXT_PUBLIC_APP_URL:-${PUBLIC_APP_URL:-http://localhost:3000}}}
      - NEXT_PUBLIC_PADDLE_ENVIRONMENT
      - NEXT_PUBLIC_PADDLE_CLIENT_TOKEN
      # Optional overrides:
      # - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      # - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${LOCAL_FRONTEND_PORT:-${FRONTEND_PORT:-3000}}:3000"
    networks:
      - fintral-dev

  nginx:
    image: nginx:1.27-alpine
    container_name: fintral-nginx-dev
    depends_on:
      - backend
      - frontend
    ports:
      - "${LOCAL_PROXY_PORT:-${PROXY_PORT:-8001}}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fintral-dev

  # ── Lago Billing Engine Stack ──
  lago-db:
    image: getlago/postgres-partman:15.0-alpine
    container_name: fintral-lago-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lago
      POSTGRES_DB: lago
    volumes:
      - lago_db_dev_data:/var/lib/postgresql/data
    networks:
      - fintral-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  lago-redis:
    image: redis:7-alpine
    container_name: fintral-lago-redis-dev
    volumes:
      - lago_redis_dev_data:/data
    networks:
      - fintral-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  lago-api:
    image: getlago/api:v1.48.1
    container_name: fintral-lago-api-dev
    ports:
      - "${LOCAL_LAGO_API_PORT:-3100}:3000"
    environment:
      PORT: 3000
      RAILS_ENV: production
      DATABASE_URL: postgresql://postgres:lago@lago-db:5432/lago?pool=5
      REDIS_URL: redis://lago-redis:6379/0
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:-change-me-dev-lago-secret-key-base-12345}
      LAGO_RSA_PRIVATE_KEY: &lago_rsa_private_key ${LAGO_RSA_PRIVATE_KEY:-}
      LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY:-change-me-dev-lago-encryption-key-32}
      LAGO_API_URL: http://localhost:3100
      LAGO_FRONT_URL: http://localhost:3200
      LAGO_ORG_NAME: Fintral
      LAGO_ORG_USER_EMAIL: admin@fintral.com
      LAGO_ORG_USER_PASSWORD: ${LAGO_ADMIN_PASSWORD:-admin123}
      LAGO_DISABLE_PDF_GENERATION: "true"
    depends_on:
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    networks:
      - fintral-dev

  lago-worker:
    image: getlago/api:v1.48.1
    container_name: fintral-lago-worker-dev
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://postgres:lago@lago-db:5432/lago?pool=5
      REDIS_URL: redis://lago-redis:6379/0
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:-change-me-dev-lago-secret-key-base-12345}
      LAGO_RSA_PRIVATE_KEY: *lago_rsa_private_key
      LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY:-change-me-dev-lago-encryption-key-32}
    depends_on:
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    networks:
      - fintral-dev

  lago-clock:
    image: getlago/api:v1.48.1
    container_name: fintral-lago-clock-dev
    command: bundle exec clockwork clock.rb
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://postgres:lago@lago-db:5432/lago?pool=5
      REDIS_URL: redis://lago-redis:6379/0
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:-change-me-dev-lago-secret-key-base-12345}
      LAGO_RSA_PRIVATE_KEY: *lago_rsa_private_key
      LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY:-change-me-dev-lago-encryption-key-32}
    depends_on:
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    networks:
      - fintral-dev

  lago-front:
    image: getlago/front:v1.48.1
    container_name: fintral-lago-front-dev
    ports:
      - "${LOCAL_LAGO_FRONT_PORT:-3200}:80"
    environment:
      LAGO_API_URL: http://localhost:3100
      APP_ENV: development
    depends_on:
      - lago-api
    networks:
      - fintral-dev

networks:
  fintral-dev:
    name: fintral-dev
    driver: bridge
  supabase_network_fintral-dev:
    name: supabase_network_fintral-dev
    external: true

volumes:
  redis_dev_data:
  uploads_data:
  static_data:
  lago_db_dev_data:
  lago_redis_dev_data:
