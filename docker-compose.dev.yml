# Development environment
# Requires: Doppler CLI + `supabase start` running in background
# Usage: doppler run -- docker compose -f docker-compose.dev.yml up -d
#
# Supabase local containers (managed by CLI):
#   - Postgres :54322
#   - GoTrue   :54321
#   - Storage  :54321 (via Kong)
# These are reached via host.docker.internal from app containers.

services:
  redis:
    image: redis:7
    container_name: fintral-redis-dev
    ports:
      - "${LOCAL_REDIS_PORT:-6381}:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - fintral-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fintral-backend-dev
    env_file: []
    environment:
      # ── Infra (topology loaded from local .env) ──
      - ENVIRONMENT=${LOCAL_ENVIRONMENT:-DEVELOPMENT}
      - BACKEND_PORT=${LOCAL_BACKEND_PORT:-8000}
      - SUPABASE_URL=${LOCAL_SUPABASE_URL}
      - SUPABASE_STORAGE_BUCKET=${LOCAL_SUPABASE_STORAGE_BUCKET:-invoices}
      - DATABASE_URL=${LOCAL_DATABASE_URL}
      - REDIS_URL=${LOCAL_REDIS_URL}
      # ── Secrets (inherited from Doppler via shell — no default) ──
      - APP_JWT_SECRET_KEY
      - SECRET_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - AI_MODEL_API_KEY
      - OPENAI_API_KEY
      - RESEND_API_KEY
      - EMAIL_FROM
      - PUBLIC_APP_URL
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - ADMIN_FULL_NAME
      - QUICKBOOKS_CLIENT_ID
      - QUICKBOOKS_CLIENT_SECRET
      - QUICKBOOKS_REDIRECT_URI
      - XERO_CLIENT_ID
      - XERO_CLIENT_SECRET
      - XERO_REDIRECT_URI
      - ALANUBE_API_URL
      - ALANUBE_JWT
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__/
      - uploads_data:/app/uploads
      - static_data:/app/static
    ports:
      - "${LOCAL_BACKEND_PORT:-8000}:${LOCAL_BACKEND_PORT:-8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fintral-dev
      - supabase_network_fintral-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fintral-frontend-dev
    environment:
      - BACKEND_URL=http://backend:${LOCAL_BACKEND_PORT:-8000}
      - NEXT_PUBLIC_ENVIRONMENT=${LOCAL_ENVIRONMENT:-DEVELOPMENT}
      - NEXT_PUBLIC_APP_URL=${LOCAL_NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Optional overrides:
      # - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      # - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${LOCAL_FRONTEND_PORT:-3000}:3000"
    networks:
      - fintral-dev

  nginx:
    image: nginx:1.27-alpine
    container_name: fintral-nginx-dev
    depends_on:
      - backend
      - frontend
    ports:
      - "${LOCAL_PROXY_PORT:-8001}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fintral-dev

networks:
  fintral-dev:
    name: fintral-dev
    driver: bridge
  supabase_network_fintral-dev:
    name: supabase_network_fintral-dev
    external: true

volumes:
  redis_dev_data:
  uploads_data:
  static_data:
