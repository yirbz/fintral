# Supabase local development config
# Generated by `supabase init` — manual tweaks for Fintral
# Reference: https://supabase.com/docs/reference/cli/config

project_id = "fintral-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54325

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
minimum_password_length = 6

# Use email/password + magic link for local dev
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
